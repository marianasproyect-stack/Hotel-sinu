
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521:XE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hotel}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ho123}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:oracle.jdbc.OracleDriver}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect


spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# Esto hace que data.sql se ejecute DESPUES de que Hibernate cree las tablas
# (con ddl-auto=update). Sin esto, Spring intenta correr data.sql antes de
# que existan las tablas y falla.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.port=${PORT:8081}
